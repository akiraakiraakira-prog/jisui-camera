name: build
on:
  push:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project JisuiCamera.xcodeproj -scheme JisuiCamera
          -configuration Release -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/JisuiCamera.app Payload/
          zip -qr JisuiCamera.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JisuiCamera-ipa
          path: JisuiCamera.ipa
