name: JisuiCamera
options:
  bundleIdPrefix: com.akira
  deploymentTarget:
    iOS: "16.0"
targets:
  JisuiCamera:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akira.jisuicamera
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 自炊カメラ
        NSCameraUsageDescription: 書籍の撮影に使用します
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  JisuiCamera:
    build:
      targets:
        JisuiCamera: all
